<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station remote</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Station">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c4cf1">
<style>
:root{
  --bg:#e9ecf3; --panel:#f6f7fb; --ink:#1b1730; --mute:#6b6a82; --line:#d3d7e5;
  --accent:#6c4cf1; --on-accent:#fff; --ok:#1f9d63; --bad:#d6453d;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14121f; --panel:#1e1b2e; --ink:#eeecf8; --mute:#9b99b3; --line:#322e4a; --accent:#8b73ff}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:start center;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
main{width:100%;max-width:420px;display:grid;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
#status{display:flex;align-items:center;gap:8px}
#status i{width:9px;height:9px;border-radius:50%;background:var(--bad)}
#status.online i{background:var(--ok)}
#status.listening i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
@media (prefers-reduced-motion:reduce){#status.listening i{animation:none}}

.cover{aspect-ratio:1;border-radius:28px;background:var(--panel) center/cover;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font-size:14px}
.meta h1{margin:0;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.meta p{margin:4px 0 0;color:var(--mute);min-height:1.3em}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6px;border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

.transport{display:flex;justify-content:center;align-items:center;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
.ico{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.ico svg{width:22px;height:22px;fill:currentColor}
.ico.main{width:72px;height:72px;background:var(--accent);color:var(--on-accent);border:0}
.ico.main svg{width:30px;height:30px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico:active{transform:scale(.95)}

.vol{display:grid;grid-template-columns:auto 1fr 3ch;gap:12px;align-items:center}
.vol output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.cmd{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px;border-radius:10px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.row{display:flex;gap:8px}
.row input{font-size:16px;flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.row button{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:0 18px;font-weight:600}
#msg,#amsg{min-height:1.2em;font-size:13px;color:var(--bad)}
#setup{gap:10px}
#setup summary{cursor:pointer;font-weight:600}
#setup input{font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
#setup .row input{width:auto}
#setup button.full{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px;font-weight:600}
#setup button.ghost,#devs button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px}
#devs{display:grid;gap:6px}
.hint{margin:0;font-size:14px;color:var(--mute)}
#setup a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
  <header><span>Yandex Station</span><span id="status"><i></i><span id="stxt">connecting</span></span></header>

  <details class="cmd" id="setup">
    <summary>Connection settings</summary>
    <p class="hint">1. <a href="#" id="signin">Sign in to Yandex</a>, allow access, then copy the full address of the page you land on and paste it here.</p>
    <div class="row"><input id="atok" placeholder="https://music.yandex.ru/#access_token=…" autocomplete="off" autocapitalize="off"><button id="asave">Save</button></div>
    <p class="hint">2. Pick your speaker, or fill in the details by hand.</p>
    <button id="find" class="ghost">Find my speakers</button>
    <div id="devs"></div>
    <input id="f-host" placeholder="Speaker IP, e.g. 192.168.1.50" inputmode="decimal" autocomplete="off">
    <input id="f-id" placeholder="Device ID" autocomplete="off" autocapitalize="off">
    <input id="f-plat" placeholder="Platform, e.g. yandexmidi" autocomplete="off" autocapitalize="off">
    <button id="s-save" class="full">Connect</button>
    <div id="amsg" role="status"></div>
  </details>

  <div id="cover" class="cover">Nothing playing</div>
  <div class="meta"><h1 id="title">—</h1><p id="sub"></p></div>

  <div>
    <input id="seek" type="range" min="0" max="100" step="1" value="0" aria-label="Position">
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
  </div>

  <div class="transport">
    <button class="ico" data-cmd="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="ico main" id="pp" aria-label="Play"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ico" data-cmd="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button>
  </div>

  <div class="vol">
    <span>Volume</span>
    <input id="vol" type="range" min="0" max="100" step="1" value="0" aria-label="Volume">
    <output id="volv">0</output>
  </div>

  <section class="cmd">
    <div class="seg" role="group" aria-label="Command type">
      <button id="m-say" aria-pressed="true">Ask Alice</button>
      <button id="m-tts" aria-pressed="false">Speak aloud</button>
    </div>
    <div class="row">
      <input id="txt" placeholder="Turn on the lights in the kitchen" autocomplete="off" maxlength="300">
      <button id="send">Send</button>
    </div>
    <div id="msg" role="status"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
let st = {}, mode = 'say', seeking = false, volDrag = false, base = {t: 0, p: 0};

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };
const fill = el => el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%');

const P = (window.Capacitor && window.Capacitor.Plugins) || {};
const reg = n => (window.Capacitor && window.Capacitor.registerPlugin) ? window.Capacitor.registerPlugin(n) : P[n];
const SS = reg('StationSocket'), Browser = reg('Browser');
const AUTH_URL = 'https://oauth.yandex.ru/authorize?response_type=token&client_id=23cabbbdc6cd418abb4b39c32c41195d';
const API = 'https://quasar.yandex.net/glagol/';
const COMMANDS = {
  ping: () => ({command: 'ping'}), play: () => ({command: 'play'}), pause: () => ({command: 'stop'}),
  next: () => ({command: 'next'}), prev: () => ({command: 'prev'}),
  volume: m => ({command: 'setVolume', volume: Math.max(0, Math.min(1, +m.value))}),
  seek: m => ({command: 'rewind', position: Math.max(0, +m.value)}),
  say: m => ({command: 'sendText', text: String(m.text).slice(0, 300)}),
  tts: m => ({command: 'sendText', text: 'Повтори за мной ' + String(m.text).slice(0, 300)}),
};
let cfg = JSON.parse(localStorage.getItem('station.cfg') || '{}'), convToken = null, online = false, gen = 0, pinger;
const saveCfg = () => localStorage.setItem('station.cfg', JSON.stringify(cfg));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const authHdr = () => ({Authorization: 'Oauth ' + cfg.token});

async function send(m) {
  try {
    if (!online) throw new Error('Not connected to the speaker.');
    await SS.send({data: JSON.stringify({conversationToken: convToken, id: rid(), payload: COMMANDS[m.cmd](m), sentTime: Date.now()})});
  } catch (e) { $('msg').textContent = e.message || String(e); }
}

async function connect() {
  const my = ++gen;
  online = false; clearInterval(pinger);
  if (!SS) { setStatus('needs the native app'); return; }
  try { await SS.disconnect(); } catch {}
  if (!cfg.token) { setStatus('needs token'); return; }
  if (!cfg.host || !cfg.deviceId) { setStatus('needs setup'); return; }
  setStatus('connecting'); $('msg').textContent = '';
  try {
    const r = await fetch(API + 'token?device_id=' + encodeURIComponent(cfg.deviceId) + '&platform=' + encodeURIComponent(cfg.platform || 'yandexmidi'), {headers: authHdr()});
    if (r.status === 401 || r.status === 403) { setStatus('token rejected'); return; }
    if (!r.ok) throw new Error('Token request failed: HTTP ' + r.status);
    convToken = (await r.json()).token;
    await SS.connect({url: 'wss://' + cfg.host + ':1961'});
    if (my !== gen) return;
    online = true; setStatus('online');
    pinger = setInterval(() => send({cmd: 'ping'}), 10000);
    send({cmd: 'ping'});
  } catch (e) {
    if (my !== gen) return;
    setStatus('offline'); $('msg').textContent = e.message || String(e);
    setTimeout(() => { if (my === gen) connect(); }, 5000);
  }
}
if (SS) {
  SS.addListener('message', e => { try { const d = JSON.parse(e.data); if (d.state) { st = d.state; render(); } } catch {} });
  SS.addListener('closed', () => {
    if (!online) return;
    online = false; setStatus('offline');
    const my = gen; setTimeout(() => { if (my === gen) connect(); }, 3000);
  });
}

function setStatus(s) {
  $('stxt').textContent = s;
  if (/token|setup/.test(s)) $('setup').open = true;
  $('status').className = s === 'online' ? 'online' : '';
}

function render() {
  const p = st.playerState || {};
  $('title').textContent = p.title || '—';
  $('sub').textContent = p.subtitle || '';
  const uri = p.extra && p.extra.coverURI;
  const c = $('cover');
  if (uri) { c.style.backgroundImage = `url(https://${uri.replace(/^https?:\/\//, '').replace('%%', '400x400')})`; c.textContent = '' }
  else { c.style.backgroundImage = ''; c.textContent = 'Nothing playing' }
  $('ppi').innerHTML = st.playing ? PAUSE : PLAY;
  $('pp').setAttribute('aria-label', st.playing ? 'Pause' : 'Play');
  $('seek').max = p.duration || 100;
  base = {t: Date.now(), p: p.progress || 0};
  if (!volDrag && st.volume != null) { $('vol').value = Math.round(st.volume * 100); $('volv').textContent = $('vol').value; fill($('vol')) }
  $('dur').textContent = fmt(p.duration);
  if (st.aliceState) {
    const listening = st.aliceState !== 'IDLE';
    $('status').className = listening ? 'listening' : 'online';
    $('stxt').textContent = listening ? st.aliceState.toLowerCase() : 'online';
  }
}

setInterval(() => {   // smooth progress between state updates
  if (seeking) return;
  const p = st.playerState || {};
  const pos = Math.min(p.duration || 0, base.p + (st.playing ? (Date.now() - base.t) / 1000 : 0));
  $('seek').value = pos; fill($('seek')); $('pos').textContent = fmt(pos);
}, 500);

document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send({cmd: b.dataset.cmd}));
$('pp').onclick = () => send({cmd: st.playing ? 'pause' : 'play'});

$('seek').oninput = e => { seeking = true; fill(e.target); $('pos').textContent = fmt(e.target.value) };
$('seek').onchange = e => { send({cmd: 'seek', value: +e.target.value}); base = {t: Date.now(), p: +e.target.value}; seeking = false };

let vt;
$('vol').oninput = e => {
  volDrag = true; fill(e.target); $('volv').textContent = e.target.value;
  clearTimeout(vt); vt = setTimeout(() => send({cmd: 'volume', value: e.target.value / 100}), 80);
};
$('vol').onchange = () => setTimeout(() => volDrag = false, 600);

function setMode(m) {
  mode = m;
  $('m-say').setAttribute('aria-pressed', m === 'say'); $('m-tts').setAttribute('aria-pressed', m === 'tts');
  $('txt').placeholder = m === 'say' ? 'Turn on the lights in the kitchen' : 'Dinner is ready';
}
$('m-say').onclick = () => setMode('say'); $('m-tts').onclick = () => setMode('tts');

function submit() {
  const t = $('txt').value.trim();
  if (!t) return;
  $('msg').textContent = '';
  send({cmd: mode, text: t}); $('txt').value = '';
}
$('send').onclick = submit;
$('txt').onkeydown = e => { if (e.key === 'Enter') submit() };

function fillForm() { $('f-host').value = cfg.host || ''; $('f-id').value = cfg.deviceId || ''; $('f-plat').value = cfg.platform || 'yandexmidi'; }
$('signin').onclick = e => { e.preventDefault(); Browser ? Browser.open({url: AUTH_URL}) : window.open(AUTH_URL); };
$('asave').onclick = () => {
  const v = $('atok').value.trim(), m = v.match(/access_token=([^&\s]+)/), tok = m ? m[1] : v;
  if (!/^[\w.\-]{20,}$/.test(tok)) { $('amsg').textContent = "That doesn't look like a token or the redirected address."; return; }
  cfg.token = tok; saveCfg(); $('atok').value = ''; $('amsg').textContent = 'Token saved.'; connect();
};
$('find').onclick = async () => {
  const box = $('devs'); box.textContent = ''; $('amsg').textContent = '';
  if (!cfg.token) { $('amsg').textContent = 'Save your token first.'; return; }
  try {
    const r = await fetch(API + 'device_list', {headers: authHdr()});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = (await r.json()).devices || [];
    if (!list.length) throw new Error('no speakers returned');
    for (const d of list) {
      const b = document.createElement('button');
      b.textContent = (d.name || d.id) + ' (' + d.platform + ')';
      b.onclick = () => {
        cfg.deviceId = d.id; cfg.platform = d.platform;
        const ip = ((d.networkInfo && d.networkInfo.ip_addresses) || []).find(a => /^\d+\.\d+\.\d+\.\d+$/.test(a));
        if (ip) cfg.host = ip;
        saveCfg(); fillForm();
      };
      box.append(b);
    }
  } catch (e) { $('amsg').textContent = 'Could not list speakers: ' + (e.message || e) + '. Enter the details by hand.'; }
};
$('s-save').onclick = () => {
  cfg.host = $('f-host').value.trim(); cfg.deviceId = $('f-id').value.trim(); cfg.platform = $('f-plat').value.trim() || 'yandexmidi';
  saveCfg(); connect();
};

fillForm();
connect();
</script>
</body>
</html>
