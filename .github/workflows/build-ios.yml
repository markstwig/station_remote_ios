name: Build iOS IPA
on: workflow_dispatch        # run it from the Actions tab
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: gem install xcodeproj
      - run: ./setup.sh
      - name: Check the Swift files were added to the Xcode project
        run: grep -q StationSocketPlugin ios/App/App.xcodeproj/project.pbxproj
      - run: ./build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Station-ipa
          path: ios/App/Station.ipa
